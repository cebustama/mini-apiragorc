services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mini-apiragorc-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mini-apiragorc-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  api:
    build: .
    container_name: mini-apiragorc-api
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    depends_on:
      - kafka
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  swarm-consumer:
    build: .
    container_name: mini-apiragorc-swarm-consumer
    command: python -m swarm.consumer
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  tools-api:
    build: .
    container_name: mini-apiragorc-tools-api
    command: uvicorn tools.tools_api:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"